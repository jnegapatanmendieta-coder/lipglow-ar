<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#e11d48"/><meta name="apple-mobile-web-app-capable" content="yes"/><title>GlowLab</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#fff1f2,#fce7f3);color:#1f1235;min-height:100vh;padding-bottom:70px}header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #fecdd3}.logo{font-weight:800;font-size:1.3rem;color:#e11d48}.view{display:none;padding:16px;max-width:600px;margin:0 auto}.view.active{display:block}.hero{background:linear-gradient(135deg,#be123c,#e11d48,#fb7185);color:#fff;border-radius:16px;padding:24px;margin-bottom:16px}.hero h1{font-size:1.5rem;margin-bottom:8px}.hero p{opacity:.95;margin-bottom:16px}.btn{border:none;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}.btn-w{background:#fff;color:#e11d48}.btn-o{background:transparent;border:2px solid #fff;color:#fff}.btn-r{background:#e11d48;color:#fff}.tones{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tone{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}.tone.on{border-color:#e11d48}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid #fecdd3;font-size:.85rem;font-weight:600;cursor:pointer}.chip.on{background:#e11d48;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(190,18,60,.1)}.swatch{height:90px;display:flex;align-items:center;justify-content:center}.dot{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}.info{padding:10px}.brand{font-size:.7rem;color:#e11d48;font-weight:700;text-transform:uppercase}.name{font-weight:600;font-size:.9rem}.price{font-weight:800;margin:4px 0}.row{display:flex;gap:6px;margin-top:8px}.row button{flex:1;padding:8px;border:none;border-radius:999px;font-weight:700;font-size:.75rem;cursor:pointer}.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #fecdd3;padding-bottom:env(safe-area-inset-bottom);z-index:100}.bnav button{flex:1;padding:10px 4px;border:none;background:0;font-size:.65rem;font-weight:700;color:#6b7280}.bnav button.on{color:#e11d48}.bnav .ic{display:block;font-size:1.2rem}.cam{background:#111;border-radius:16px;aspect-ratio:3/4;max-height:50vh;position:relative;overflow:hidden;margin-bottom:12px}#vid,#cv{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#cv{position:absolute;inset:0;pointer-events:none}.panel{background:#fff;border-radius:14px;padding:14px}label{font-weight:700;font-size:.85rem}input[type=range]{width:100%;accent-color:#e11d48}.list{max-height:160px;overflow-y:auto;margin:8px 0}.item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer}.item.on{background:#fdf2f8}.item .d{width:24px;height:24px;border-radius:50%}.cart-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f1235;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:200;transition:.3s;opacity:0}.toast.show{transform:translateX(-50%);opacity:1}.form input,.form select{width:100%;padding:12px;border:1.5px solid #fecdd3;border-radius:10px;margin:6px 0 12px;font-size:1rem}</style></head><body><header><div class="logo">GlowLab</div><div id="cartN" style="font-weight:700;color:#e11d48">0</div></header><section class="view active" id="v-home"><div class="hero"><h1>Find your perfect shade</h1><p>25 shades per brand · skintone matches · AR try-on</p><button class="btn btn-w" onclick="go('shop')">Shop Makeup</button> <button class="btn btn-o" onclick="go('tryon')">AR Try-On</button></div><p style="font-weight:700;margin-bottom:8px">Your skintone</p><div class="tones" id="tones"></div><div class="chips" id="cats"></div><div class="grid" id="feat"></div></section><section class="view" id="v-shop"><h2>Shop</h2><div class="chips" id="shopCats"></div><div class="chips" id="brands"></div><div class="grid" id="shop"></div><button class="btn btn-r" id="more" style="width:100%;margin-top:12px;display:none" onclick="loadMore()">Load more</button></section><section class="view" id="v-tryon"><h2>AR Try-On</h2><div class="cam"><video id="vid" autoplay playsinline muted></video><canvas id="cv"></canvas></div><button class="btn btn-r" id="camBtn" style="width:100%;margin-bottom:12px" onclick="toggleCam()">Start Front Camera</button><div class="panel"><label>Type</label><div class="chips" id="arTypes"></div><label>Intensity <span id="iv">55</span>%</label><input type="range" min="10" max="90" value="55" id="inten" oninput="document.getElementById('iv').textContent=this.value"><label>Shade</label><div class="list" id="arList"></div><button class="btn btn-r" style="width:100%" onclick="addSelected()">Add to Cart</button></div></section><section class="view" id="v-cart"><h2>Cart</h2><div id="cartBox"></div></section><section class="view" id="v-check"><h2>Checkout</h2><form class="form" onsubmit="placeOrder(event)"><input required placeholder="Full name" id="nm"><input required type="email" placeholder="Email" id="em"><input required placeholder="Address" id="ad"><input required placeholder="City" id="ct"><select id="pay"><option>Card</option><option>PayPal</option><option>Apple Pay</option></select><button class="btn btn-r" style="width:100%" type="submit">Place Order</button></form></section><nav class="bnav"><button class="on" onclick="go('home')"><span class="ic">Home</span></button><button onclick="go('shop')"><span class="ic">Shop</span></button><button onclick="go('tryon')"><span class="ic">Try-On</span></button><button onclick="go('cart')"><span class="ic">Cart</span></button></nav><div class="toast" id="toast"></div><script>
const BRANDS=["MAC","Fenty Beauty","Rare Beauty","Maybelline","NARS","Charlotte Tilbury","e.l.f.","L'Oreal"];
const TONES=[{id:"fair",h:"#f8e4d4"},{id:"light",h:"#efd0b0"},{id:"medium",h:"#d4a574"},{id:"tan",h:"#b07a4a"},{id:"deep",h:"#8d5524"},{id:"rich",h:"#5c3317"}];
const CATS=["all","lipstick","blush","mascara","foundation"];
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,"0")};return"#"+f(0)+f(8)+f(4)}
const PRODUCTS=[];let pid=1;
BRANDS.forEach(b=>{
for(let i=0;i<25;i++){const h=(i*14)%360,s=40+i%40,l=35+i%30;PRODUCTS.push({id:pid++,brand:b,cat:"lipstick",name:["Ruby","Rose","Pink","Coral","Nude","Berry"][i%6]+" "+(i+1),hex:hsl(h,s,l),price:b.includes("e.l.f")||b==="Maybelline"?9.99:24,rec:l>50?["fair","light"]:["medium","tan","deep"]})}
for(let i=0;i<25;i++){const h=340+(i*3)%40,s=35+i%30,l=50+i%25;PRODUCTS.push({id:pid++,brand:b,cat:"blush",name:["Soft Pink","Peachy","Rose","Coral"][i%4]+" "+(i+1),hex:hsl(h,s,l),price:12,rec:["fair","light","medium","tan"]})}
for(let i=0;i<4;i++)PRODUCTS.push({id:pid++,brand:b,cat:"mascara",name:["Sky High","Volume","Length","Curl"][i],hex:"#111",price:14,rec:TONES.map(t=>t.id)});
});
["Porcelain","Ivory","Beige","Sand","Golden","Caramel","Espresso","Mahogany"].forEach((n,i)=>{const hx=["#f5e0c9","#efd5b8","#e0c09a","#d4a574","#c49060","#a67c52","#6b3a1f","#4a2a14"][i];BRANDS.slice(0,4).forEach(b=>PRODUCTS.push({id:pid++,brand:b,cat:"foundation",name:n,hex:hx,price:28,rec:[TONES[Math.min(i,5)].id]}));});
let cart=JSON.parse(localStorage.getItem("gl_cart")||"[]");let tone=localStorage.getItem("gl_tone")||null;let filter="all",brand="all",page=0,arSel=null,stream=null,arType="lipstick";
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function save(){localStorage.setItem("gl_cart",JSON.stringify(cart));document.getElementById("cartN").textContent=String(cart.reduce((s,i)=>s+i.qty,0))}
function go(v){document.querySelectorAll(".view").forEach(e=>e.classList.remove("active"));document.getElementById("v-"+v).classList.add("active");document.querySelectorAll(".bnav button").forEach((b,i)=>b.classList.toggle("on",["home","shop","tryon","cart"][i]===v));if(v==="shop")renderShop(true);if(v==="cart")renderCart();if(v==="tryon")renderAR();if(v!=="tryon")stopCam();window.scrollTo(0,0)}
function card(p){const match=tone&&p.rec.includes(tone);return `<div class="card"><div class="swatch" style="background:linear-gradient(145deg,${p.hex}99,${p.hex})"><div class="dot" style="background:${p.hex}"></div></div><div class="info"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="price">$${p.price.toFixed(2)}</div>${match?'<div style="color:#e11d48;font-size:.75rem;font-weight:700">Match</div>':''}<div class="row"><button style="background:#fce7f3;color:#e11d48" onclick="go('tryon');arSel=${p.id};arType='${p.cat}';renderAR()">Try</button><button style="background:#e11d48;color:#fff" onclick="add(${p.id})">Add</button></div></div></div>`}
function filtered(){let L=PRODUCTS.filter(p=>(filter==="all"||p.cat===filter)&&(brand==="all"||p.brand===brand));if(tone)L=[...L].sort((a,b)=>(b.rec.includes(tone)?1:0)-(a.rec.includes(tone)?1:0));return L}
function renderFeat(){document.getElementById("feat").innerHTML=filtered().slice(0,8).map(card).join("")}
function renderShop(reset){if(reset)page=0;const L=filtered();const slice=L.slice(0,(page+1)*24);document.getElementById("shop").innerHTML=slice.map(card).join("");document.getElementById("more").style.display=slice.length<L.length?"block":"none"}
function loadMore(){page++;renderShop(false)}
function add(id){const p=PRODUCTS.find(x=>x.id===id);const e=cart.find(x=>x.id===id);if(e)e.qty++;else cart.push({id:p.id,name:p.name,brand:p.brand,hex:p.hex,price:p.price,qty:1});save();toast("Added "+p.name)}
function renderCart(){const box=document.getElementById("cartBox");if(!cart.length){box.innerHTML='<p style="color:#6b7280;text-align:center;padding:40px">Cart is empty</p>';return}const total=cart.reduce((s,i)=>s+i.price*i.qty,0);box.innerHTML=cart.map((i,idx)=>`<div class="cart-item"><div style="width:44px;height:44px;border-radius:10px;background:${i.hex}"></div><div style="flex:1"><b>${i.brand}</b><br>${i.name}<br>$${i.price.toFixed(2)}</div><button onclick="cart[${idx}].qty--;if(cart[${idx}].qty<=0)cart.splice(${idx},1);save();renderCart()" style="border:none;background:#fce7f3;width:28px;height:28px;border-radius:50%;font-weight:800">-</button><span>${i.qty}</span><button onclick="cart[${idx}].qty++;save();renderCart()" style="border:none;background:#fce7f3;width:28px;height:28px;border-radius:50%;font-weight:800">+</button></div>`).join("")+`<div style="background:#fff;border-radius:12px;padding:14px;margin-top:12px"><b>Total: $${total.toFixed(2)}</b><button class="btn btn-r" style="width:100%;margin-top:10px" onclick="go('check')">Checkout</button></div>`}
function placeOrder(e){e.preventDefault();if(!cart.length)return toast("Cart empty");cart=[];save();toast("Order placed!");go("home")}
function renderAR(){document.getElementById("arTypes").innerHTML=["lipstick","blush","mascara"].map(t=>`<button class="chip ${arType===t?'on':''}" onclick="arType='${t}';arSel=null;renderAR()">${t}</button>`).join("");let L=PRODUCTS.filter(p=>p.cat===arType).slice(0,40);if(tone)L.sort((a,b)=>(b.rec.includes(tone)?1:0)-(a.rec.includes(tone)?1:0));document.getElementById("arList").innerHTML=L.map(p=>`<div class="item ${arSel===p.id?'on':''}" onclick="arSel=${p.id};renderAR()"><div class="d" style="background:${p.hex}"></div><div><b>${p.brand}</b><br>${p.name}</div></div>`).join("")}
function addSelected(){if(!arSel)return toast("Pick a shade");add(arSel)}
async function toggleCam(){if(stream){stopCam();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});document.getElementById("vid").srcObject=stream;document.getElementById("camBtn").textContent="Stop Camera";draw()}catch(e){toast("Allow camera permission")}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("camBtn").textContent="Start Front Camera";const c=document.getElementById("cv");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function draw(){if(!stream)return;const v=document.getElementById("vid"),c=document.getElementById("cv"),ctx=c.getContext("2d");if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;ctx.clearRect(0,0,c.width,c.height);if(arSel){const p=PRODUCTS.find(x=>x.id===arSel);const a=document.getElementById("inten").value/100;ctx.globalAlpha=a*0.8;ctx.fillStyle=p.hex;if(p.cat==="lipstick"){ctx.beginPath();ctx.ellipse(c.width*0.5,c.height*0.66,c.width*0.16,c.height*0.04,0,0,Math.PI*2);ctx.fill()}else if(p.cat==="blush"){ctx.beginPath();ctx.ellipse(c.width*0.28,c.height*0.48,c.width*0.12,c.width*0.08,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.width*0.72,c.height*0.48,c.width*0.12,c.width*0.08,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}}requestAnimationFrame(draw)}
document.getElementById("tones").innerHTML=TONES.map(t=>`<button class="tone ${tone===t.id?'on':''}" style="background:${t.h}" onclick="tone='${t.id}';localStorage.setItem('gl_tone',tone);document.querySelectorAll('.tone').forEach(x=>x.classList.remove('on'));this.classList.add('on');renderFeat();if(document.getElementById('v-shop').classList.contains('active'))renderShop(true)"></button>`).join("");
function setFilter(c){filter=c;document.querySelectorAll('#cats .chip,#shopCats .chip').forEach(x=>x.classList.toggle('on',x.textContent===c));renderFeat();if(document.getElementById('v-shop').classList.contains('active'))renderShop(true)}
document.getElementById("cats").innerHTML=CATS.map(c=>`<button class="chip ${filter===c?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join("");
document.getElementById("shopCats").innerHTML=CATS.map(c=>`<button class="chip ${filter===c?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join("");
document.getElementById("brands").innerHTML=`<button class="chip on" onclick="brand='all';renderShop(true)">All Brands</button>`+BRANDS.map(b=>`<button class="chip" onclick="brand='${b}';renderShop(true)">${b}</button>`).join("");
save();renderFeat();
</script></body></html>
